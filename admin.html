<!DOCTYPE html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Desi Anday</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#222;padding:14px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 6px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.st{background:#fff3df;border-radius:10px;padding:10px;text-align:center}.st b{display:block;font-size:24px;color:#c9791a}
input,button,select{padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px;font:inherit}button{background:#c9791a;color:#fff;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}.wrap{overflow-x:auto}
</style></head><body>
<div class="card" id="login"><b>Admin Password</b><br><input id="pw" type="password"> <button onclick="go()">Login</button> <span id="err" style="color:red"></span></div>
<div id="app" hidden>
<div class="grid" id="stats"></div><br>
<div class="card"><b>Aaj ka stock add karein</b><br><input id="aq" type="number" placeholder="Naye anday"> <input id="ap" type="number" step="0.5" placeholder="Rate per anda (Rs)"> <button onclick="add()">Save</button></div>
<div class="card wrap"><b>Orders</b><table id="orders"></table></div>
<div class="card wrap"><b>Roz ka stock</b><table id="daily"></table></div>
<div class="card"><b>Shikayaat</b><div id="comps"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let PW=sessionStorage.pw||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(a,b){const r=await fetch('/api?a='+a,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-admin':PW},body:b?JSON.stringify(b):undefined});return [r.ok,await r.json()]}
async function go(){PW=$('pw').value||PW;const [ok,d]=await api('admin');if(!ok){$('err').textContent=d.error;return}sessionStorage.pw=PW;$('login').hidden=true;$('app').hidden=false;draw(d)}
async function refresh(){const [ok,d]=await api('admin');if(ok)draw(d)}
function draw(d){const O=d.orders,sum=(f)=>O.filter(f).reduce((s,o)=>s+o.qty,0);
const pend=O.filter(o=>o.status==='pending'),del=O.filter(o=>o.status==='delivered'),td=O.filter(o=>o.day===d.today&&o.status!=='cancelled');
$('stats').innerHTML=[['Stock bacha',d.stock],['Rate Rs',d.price],['Aaj ke orders',td.length],['Aaj ke anday',td.reduce((s,o)=>s+o.qty,0)],
['Kul orders',O.filter(o=>o.status!=='cancelled').length],['Dene baqi (anday)',sum(o=>o.status==='pending')],['Dene baqi (orders)',pend.length],
['Deliver ho chuke',sum(o=>o.status==='delivered')],['Kul kamai Rs',del.reduce((s,o)=>s+o.total,0)]].map(x=>`<div class="st">${x[0]}<b>${x[1]}</b></div>`).join('');
$('orders').innerHTML='<tr><th>Naam</th><th>Phone</th><th>Address</th><th>Qty</th><th>Rs</th><th>Status</th></tr>'+O.map(o=>`<tr><td>${esc(o.name)}</td><td><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></td><td>${esc(o.address)}</td><td>${o.qty}</td><td>${o.total}</td>
<td><select onchange="st('${o.id}',this.value)">${['pending','delivered','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');
$('daily').innerHTML='<tr><th>Tareekh</th><th>Stock add</th><th>Orders</th><th>Anday biky</th></tr>'+Object.keys(d.daily).sort().reverse().map(k=>{const x=O.filter(o=>o.day===k&&o.status!=='cancelled');return `<tr><td>${k}</td><td>${d.daily[k]}</td><td>${x.length}</td><td>${x.reduce((s,o)=>s+o.qty,0)}</td></tr>`}).join('');
$('comps').innerHTML=d.complaints.map(c=>`<p><b>${esc(c.name||'Unknown')}</b> ${esc(c.phone||'')}<br>${esc(c.message)} <button onclick="dc('${c.id}')">Hatao</button></p>`).join('')||'Koi shikayat nahi'}
async function add(){await api('addstock',{qty:$('aq').value,price:$('ap').value});$('aq').value=$('ap').value='';refresh()}
async function st(id,status){await api('status',{id,status});refresh()}
async function dc(id){await api('delcomplaint',{id});refresh()}
if(PW)go();
</script></body></html>
